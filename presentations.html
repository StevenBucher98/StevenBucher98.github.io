<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Presentations — Steven Bucher</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <script src="site.js"></script>
  <script src="presentations.js"></script>
  <main class="site-main">
    <section class="section">
      <h1>Presentations</h1>
      <p class="muted">Video recordings of presentations I've given — recordings from conferences, meetups and online talks.</p>

      <div class="presentations-controls">
        <div class="control-group">
          <label>Sort by:</label>
          <div class="button-group">
            <button class="sort-btn active" data-sort="newest">Newest First</button>
            <button class="sort-btn" data-sort="oldest">Oldest First</button>
          </div>
        </div>
      </div>

      <p id="presentation-count" class="muted" style="margin-top: 16px;"></p>

      <div id="presentations-container" class="presentations-list">
        <p class="muted">Loading presentations...</p>
      </div>

    </section>
  </main>
</body>
</html>
