<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Project — Steven Bucher</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <script src="site.js"></script>
  <main class="site-main">
    <section class="section">
      <div id="projectDetail"></div>
    </section>
  </main>

  <script>
    async function init(){
      const params = new URLSearchParams(location.search);
      const slug = params.get('slug');
      if (!slug) { document.getElementById('projectDetail').innerHTML = '<p class="muted">No project specified.</p>'; return; }
      try {
        const res = await fetch('data/projects.json');
        const projects = await res.json();
        const p = projects.find(x=>x.slug===slug);
        if (!p) { document.getElementById('projectDetail').innerHTML = '<p class="muted">Project not found.</p>'; return; }
        const container = document.getElementById('projectDetail');
        container.innerHTML = `
          <h1>${p.title}</h1>
          <p class="muted">${p.date || ''}</p>
          <p>${p.summary || ''}</p>
          <div style="margin-top:14px;">
            <a class="btn" href="${p.page || '#'}" target="_blank">Open (new tab)</a>
            <a class="btn outline" href="${p.page || '#'}">Open Here</a>
          </div>
          `;
        // try embed if the page exists and is safe to embed
        if (p.page && p.page.endsWith('.html')){
          const iframe = document.createElement('iframe');
          iframe.src = p.page;
          iframe.style.width = '100%';
          iframe.style.height = '680px';
          iframe.style.border = '1px solid #eee';
          iframe.style.marginTop = '18px';
          container.appendChild(iframe);
        }
      }catch(e){ console.error(e); document.getElementById('projectDetail').innerHTML = '<p class="muted">Failed to load project.</p>'; }
    }
    init();
  </script>
</body>
</html>
